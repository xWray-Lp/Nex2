name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest

      - name: Run lexer tests (pytest)
        run: python -m pytest test_lexer.py -v

      - name: AST field coverage gate
        run: python check_ast_coverage.py

      - name: Opcode coverage gate
        run: python check_opcodes.py

      - name: Run type checker tests
        run: python test_typechecker.py

      - name: Run @stack tests
        run: python test_stack.py

      - name: Run @own tests
        run: python test_own.py

      - name: Run bytecode/VM tests
        run: python test_bytecode.py

      - name: VM ↔ tree-walker parity matrix (all examples)
        run: python check_vm_parity.py

      - name: Run examples
        run: |
          python main.py examples/hello.nex
          python main.py examples/fizzbuzz.nex
          python main.py examples/stack.nex
          python main.py examples/data_pipeline.nex
          python main.py examples/tree_own.nex
          python main.py examples/buffer_econ.nex
          python main.py test_features.nex
